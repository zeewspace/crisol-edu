# edu- hooks (opcional, solo para feedback local rápido)
# Qué es lefthook: gestor de git hooks. Corre ANTES de que el commit se cree:
#  - pre-commit: eslint en archivos staged + gitleaks (secret scan)
#  - commit-msg: commitlint (valida que el mensaje sea conventional commits)
# Si no está instalado, no pasa nada: el CI (edu-ci.yml) hace las mismas checks.
# Install: npx lefthook install  (o npm run prepare — corre solo)
pre-commit:
  parallel: true
  commands:
    edu-lint:
      glob: "*.{js,ts,jsx,tsx,mjs}"
      run: npx eslint {staged_files} --max-warnings 50
      stage_fixed: true
    edu-gitleaks:
      run: gitleaks protect --staged --verbose --redact --no-banner
      # if gitleaks not installed, skip gracefully
      skip: '{{not (exe "gitleaks")}}'

commit-msg:
  commands:
    edu-commitlint:
      run: npx --no -- commitlint --edit {1}
