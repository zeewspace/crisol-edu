name: edu-review

# Local-first: review solo en PR opened/reopened y /edu-review manual (no en cada synchronize).
on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions: read-all

concurrency:
  group: edu-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  edu-review:
    # Solo OWNER/MEMBER/COLLABORATOR pueden disparar /edu-review. CONTRIBUTOR solo si es su propio PR.
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/edu-review') &&
       contains(fromJson('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a9 # v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci || npm install

      - name: Run edu-code-review
        # skill("edu-code-review") — advisory, local-first, nunca bloquea
        env:
          RESULTS: .crisol/results/edu-score.json
        run: |
          echo "::notice::Running edu-code-review (advisory, docs/edu-rubric.md is source of truth)"
          npm run edu:lint --if-present || echo "edu:lint warnings (advisory)"
          mkdir -p .crisol/results .crisol/history
          node ./scripts/edu-score.mjs --full --out "$RESULTS" || echo '{"security":0,"performance":0,"cleanCode":0,"organization":0,"final":0,"grade":"pending","deductions":[]}' > "$RESULTS"
          cat "$RESULTS" || true

      - name: Comment edu-scorecard
        if: github.event_name == 'pull_request' || contains(github.event.comment.body, '/edu-review')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34d # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const path = '.crisol/results/edu-score.json';
            let score = { security: 0, performance: 0, cleanCode: 0, organization: 0, final: 0, grade: 'pending', deductions: [] };
            try { score = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
            const body = `## edu-code-review — Scorecard (advisory)

            | Eje | Score |
            |-----|-------|
            | **S Security** | ${score.security} /10 |
            | **P Performance** | ${score.performance} /10 |
            | **C Clean Code** | ${score.cleanCode} /10 |
            | **O Organization** | ${score.organization} /10 |
            | **Final** | **${score.final} /10 — ${score.grade}** |

            > Fuente: \`docs/edu-rubric.md\` · Modo advisory: no bloquea merge · Comando: \`/edu-review\` · Local-first: \`npm run edu:review\`

            <details><summary>Deducciones</summary>

            \`\`\`json
            ${JSON.stringify(score.deductions, null, 2)}
            \`\`\`
            </details>

            Ver rubric para fixes sugeridos: \`docs/edu-rubric.md\`
            `;
            const pr = context.payload.pull_request || context.payload.issue;
            const prNumber = pr.number || context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });

      - name: Upload edu-score.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b48861d22a16335 # v4.6.2
        with:
          name: edu-score.json
          path: .crisol/results/edu-score.json
          retention-days: 14
          if-no-files-found: warn
