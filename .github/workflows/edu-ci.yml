name: edu-ci

# Local-first: CI solo en main. El feedback rápido es local (npm run edu:review).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions: read-all

concurrency:
  group: edu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edu-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a9 # v4.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run edu:lint

  edu-gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e37f500700deea8f775312362a07d3370 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  edu-commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a9 # v4.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from="$BASE_SHA" --to="$HEAD_SHA" --verbose
